name: Build and Upload Gradle Shadow JAR

on:
  push:
    branches:
      - master

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    # environment: production

    steps:
      # Checkout des Repositories
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Setze Java-Version
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'

      # Gradle-Wrapper ausführbar machen
      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      # Shadow JAR bauen (erzeugt im Ordner "output" die spezifischen JARs)
      # GITHUB_TOKEN wird von Gradle als Fallback für gpr.key genutzt
      # (Zugriff auf die de.teamholy-Pakete unter teamholy-network/holy-core)
      - name: Build JAR with Gradle ShadowJar
        run: ./gradlew clean shadowJar
        env:
          GITHUB_TOKEN: ${{ secrets.GPR_KEY }}

      # Verify that the JAR files are present in the expected output folders
      - name: Verify JAR files
        run: |
          for dir in Bedwars Bridge Clutches KnockbackFFA MLGRush SGFFA; do
            find "$dir/build/libs" -type f -name "*-all.jar" -exec ls -lh {} \;
          done

      # Game-Jars als Maven-Artefakte (de.teamholy:<spiel>:1.0-SNAPSHOT)
      # nach GitHub Packages hochladen (teamholy-network/holy-games)
      - name: Publish JARs to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GPR_KEY }}
